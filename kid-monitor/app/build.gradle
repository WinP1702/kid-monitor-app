plugins {
    id 'com.android.application'
}

android {
    namespace 'com.parentalcontrol.kidmonitor'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.parentalcontrol.kidmonitor"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        archivesBaseName = "system-service"
        buildConfigField "String", "SUPABASE_URL", '"https://tyqdiqppcxckpzbqpilo.supabase.co"'
        buildConfigField "String", "SUPABASE_KEY", '"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cWRpcXBwY3hja3B6YnFwaWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzAwNzQsImV4cCI6MjEwNDg0NjA3NH0.4-faernAlY8LwOb99f5Qbk49LttA9qtoWHmR2veQ3NU"'

        // Only include arm64 native libs — covers 99%+ of modern devices
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        pickFirst 'lib/**/*.so'
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // WebRTC (screen capture + P2P streaming)
    implementation 'io.github.webrtc-sdk:android:125.6422.06.1'

    // OkHttp — Supabase Realtime signaling (WebSocket) + REST API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
}
